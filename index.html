<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telegram Web</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Telegram Font & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
    }

    /* Telegram Wallpaper Background */
    .tg-chat-bg {
      background-color: #0e1621;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Custom Telegram Scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Tail of chat bubbles */
    .bubble-in {
      border-bottom-left-radius: 4px !important;
    }
    .bubble-out {
      border-bottom-right-radius: 4px !important;
    }
  </style>
</head>
<body class="bg-[#17212b] text-[#f5f5f5] h-screen w-screen flex overflow-hidden">

  <!-- Left Sidebar (Chats List) -->
  <div id="sidebar" class="w-full md:w-[420px] bg-[#17212b] border-r border-[#0e1621] flex flex-col h-full shrink-0 z-20">
    
    <!-- Top Action Bar -->
    <div class="h-14 px-3 flex items-center justify-between gap-3 border-b border-[#0e1621]">
      <button onclick="toggleSideMenu()" class="p-2.5 rounded-full hover:bg-[#242f3d] text-[#708499] hover:text-white transition">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      
      <!-- Search Bar -->
      <div class="flex-1 relative">
        <input type="text" id="searchInput" oninput="renderChats()" placeholder="Search" 
               class="w-full pl-10 pr-4 py-2 bg-[#242f3d] text-sm text-white rounded-full placeholder-[#708499] focus:outline-none focus:ring-1 focus:ring-[#5288c1]">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-[#708499] text-xs"></i>
      </div>

      <button onclick="openModal()" class="p-2.5 rounded-full hover:bg-[#242f3d] text-[#5288c1] transition" title="New Chat">
        <i class="fa-solid fa-pen text-base"></i>
      </button>
    </div>

    <!-- Folders / Tabs Bar -->
    <div class="flex items-center px-2 bg-[#17212b] border-b border-[#0e1621] text-sm font-medium">
      <button onclick="switchFolder('all')" id="tab-all" class="folder-tab py-2.5 px-4 text-[#5288c1] border-b-2 border-[#5288c1] transition">All Chats</button>
      <button onclick="switchFolder('direct')" id="tab-direct" class="folder-tab py-2.5 px-4 text-[#708499] border-b-2 border-transparent hover:text-white transition">Personal</button>
      <button onclick="switchFolder('group')" id="tab-group" class="folder-tab py-2.5 px-4 text-[#708499] border-b-2 border-transparent hover:text-white transition">Groups</button>
      <button onclick="switchFolder('channel')" id="tab-channel" class="folder-tab py-2.5 px-4 text-[#708499] border-b-2 border-transparent hover:text-white transition">Channels</button>
    </div>

    <!-- Conversations List -->
    <div id="chatsList" class="flex-1 overflow-y-auto custom-scroll divide-y divide-[#0e1621]/40"></div>

    <!-- New Channel/Group Floating Button for Mobile -->
    <div class="md:hidden fixed bottom-5 right-5">
      <button onclick="openModal()" class="w-14 h-14 rounded-full bg-[#5288c1] shadow-lg flex items-center justify-center text-white text-xl">
        <i class="fa-solid fa-pen"></i>
      </button>
    </div>
  </div>

  <!-- Right Side / Active Chat Area -->
  <div id="chatArea" class="hidden md:flex flex-1 flex-col h-full tg-chat-bg relative z-10">

    <!-- Active Chat Header -->
    <div id="chatHeader" class="h-14 px-4 bg-[#17212b] border-b border-[#0e1621] flex items-center justify-between shrink-0 shadow-sm">
      <div class="flex items-center gap-3">
        <button onclick="backToSidebar()" class="md:hidden p-2 rounded-full hover:bg-[#242f3d] text-[#708499]">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </button>
        <div id="headerAvatar" class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-base bg-[#5288c1]">
          T
        </div>
        <div>
          <h2 id="headerTitle" class="text-sm font-semibold text-white leading-tight">Select a Chat</h2>
          <span id="headerStatus" class="text-xs text-[#708499]">offline</span>
        </div>
      </div>
      <div class="flex items-center gap-2 text-[#708499]">
        <button class="p-2 rounded-full hover:bg-[#242f3d] hover:text-white"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="p-2 rounded-full hover:bg-[#242f3d] hover:text-white"><i class="fa-solid fa-phone"></i></button>
        <button class="p-2 rounded-full hover:bg-[#242f3d] hover:text-white"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="messagesArea" class="flex-1 overflow-y-auto px-4 py-3 custom-scroll flex flex-col space-y-2"></div>

    <!-- Bottom Message Bar -->
    <div class="p-3 bg-[#17212b] flex items-end gap-2 border-t border-[#0e1621]">
      <label for="fileAttachment" class="cursor-pointer p-2.5 rounded-full hover:bg-[#242f3d] text-[#708499] hover:text-[#5288c1] transition">
        <i class="fa-solid fa-paperclip text-lg"></i>
        <input type="file" id="fileAttachment" class="hidden" onchange="sendAttachment(event)" />
      </label>

      <div class="flex-1 bg-[#242f3d] rounded-2xl flex items-center px-4 py-2 border border-transparent focus-within:border-[#5288c1]/50">
        <textarea id="msgBox" rows="1" onkeydown="checkEnter(event)" placeholder="Write a message..." 
                  class="w-full bg-transparent text-sm text-white resize-none outline-none max-h-32 placeholder-[#708499] custom-scroll"></textarea>
      </div>

      <button onclick="handleSend()" class="p-2.5 rounded-full bg-[#5288c1] hover:bg-[#4374a5] text-white w-10 h-10 flex items-center justify-center transition shadow">
        <i class="fa-solid fa-paper-plane text-sm"></i>
      </button>
    </div>

  </div>

  <!-- Create Dialog / Modal -->
  <div id="newDialogModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-[#242f3d] border border-[#0e1621] w-full max-w-sm rounded-2xl p-5 shadow-2xl">
      <h3 class="text-base font-bold mb-4 text-white">Create New Channel or Group</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-[#708499] mb-1">Type</label>
          <select id="convoType" class="w-full bg-[#17212b] border border-[#0e1621] rounded-lg p-2.5 text-sm text-white outline-none">
            <option value="direct">Direct Message</option>
            <option value="group">New Group</option>
            <option value="channel">New Channel</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-[#708499] mb-1">Title</label>
          <input type="text" id="convoTitle" placeholder="e.g. Daily Updates" class="w-full bg-[#17212b] border border-[#0e1621] rounded-lg p-2.5 text-sm text-white outline-none focus:border-[#5288c1]">
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button onclick="closeModal()" class="px-4 py-2 text-sm text-[#708499] hover:text-white">Cancel</button>
          <button onclick="confirmCreateConvo()" class="px-4 py-2 text-sm bg-[#5288c1] rounded-lg text-white font-medium hover:bg-[#4374a5]">Create</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Script Application Logic -->
  <script>
    // State
    let chats = JSON.parse(localStorage.getItem('tg_clone_chats')) || [
      {
        id: 1,
        title: "Telegram News",
        type: "channel",
        avatar: "📢",
        color: "bg-[#5288c1]",
        unread: 1,
        messages: [
          { from: "them", text: "Welcome to Telegram Web clone!", time: "11:00 AM" }
        ]
      },
      {
        id: 2,
        title: "Developers Community",
        type: "group",
        avatar: "👥",
        color: "bg-[#3ca568]",
        unread: 0,
        messages: [
          { from: "them", text: "This application runs client-side with instant UI response.", time: "11:05 AM" }
        ]
      },
      {
        id: 3,
        title: "Saved Messages",
        type: "direct",
        avatar: "🔖",
        color: "bg-[#2f88e6]",
        unread: 0,
        messages: [
          { from: "me", text: "Store links, photos, and files here.", time: "11:08 AM" }
        ]
      }
    ];

    let currentChatId = 1;
    let activeFilter = 'all';

    function init() {
      renderChats();
      selectChat(currentChatId);
    }

    function renderChats() {
      const container = document.getElementById('chatsList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      const filtered = chats.filter(c => {
        const matchesFilter = activeFilter === 'all' || c.type === activeFilter;
        const matchesSearch = c.title.toLowerCase().includes(search);
        return matchesFilter && matchesSearch;
      });

      filtered.forEach(c => {
        const last = c.messages[c.messages.length - 1];
        const isSelected = c.id === currentChatId;

        const el = document.createElement('div');
        el.className = `flex items-center gap-3 px-3 py-2.5 cursor-pointer transition ${isSelected ? 'bg-[#2b5278]' : 'hover:bg-[#202b36]'}`;
        el.onclick = () => selectChat(c.id);

        el.innerHTML = `
          <div class="w-12 h-12 rounded-full ${c.color} flex items-center justify-center text-lg font-bold shrink-0 shadow-sm">
            ${c.avatar}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <h4 class="text-sm font-semibold truncate text-white">${c.title}</h4>
              <span class="text-xs text-[#708499]">${last ? last.time : ''}</span>
            </div>
            <div class="flex items-center justify-between mt-1">
              <p class="text-xs text-[#708499] truncate flex-1 pr-2">${last ? (last.file ? '📎 ' + last.file : last.text) : 'No messages'}</p>
              ${c.unread ? `<span class="bg-[#5288c1] text-[10px] font-bold px-1.5 py-0.5 rounded-full text-white">${c.unread}</span>` : ''}
            </div>
          </div>
        `;
        container.appendChild(el);
      });
    }

    function selectChat(id) {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      if (!chat) return;

      chat.unread = 0;
      saveState();

      document.getElementById('headerTitle').innerText = chat.title;
      document.getElementById('headerStatus').innerText = chat.type === 'channel' ? 'broadcast channel' : (chat.type === 'group' ? 'group members' : 'online');
      
      const av = document.getElementById('headerAvatar');
      av.innerText = chat.avatar;
      av.className = `w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-base ${chat.color}`;

      renderMessages();

      // Mobile visibility
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('hidden');
        document.getElementById('chatArea').classList.remove('hidden');
        document.getElementById('chatArea').classList.add('flex');
      }

      renderChats();
    }

    function backToSidebar() {
      document.getElementById('sidebar').classList.remove('hidden');
      document.getElementById('chatArea').classList.add('hidden');
      document.getElementById('chatArea').classList.remove('flex');
    }

    function renderMessages() {
      const container = document.getElementById('messagesArea');
      container.innerHTML = '';

      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;

      chat.messages.forEach(msg => {
        const isMe = msg.from === 'me';
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;

        let body = `<span class="break-words">${msg.text}</span>`;
        if (msg.file) {
          body = `
            <div class="flex items-center gap-2 p-2 bg-black/20 rounded-lg mb-1">
              <i class="fa-solid fa-file text-[#5288c1] text-lg"></i>
              <span class="text-xs truncate max-w-[180px]">${msg.file}</span>
            </div>
            ${msg.text ? `<span class="break-words">${msg.text}</span>` : ''}
          `;
        }

        msgDiv.innerHTML = `
          <div class="max-w-[85%] md:max-w-[70%] px-3.5 py-2 rounded-2xl text-sm leading-relaxed shadow relative ${isMe ? 'bg-[#2b5278] text-white bubble-out' : 'bg-[#182533] text-white bubble-in'}">
            ${body}
            <div class="flex items-center justify-end gap-1 text-[10px] text-[#708499] mt-1 float-right pl-3">
              <span>${msg.time}</span>
              ${isMe ? '<i class="fa-solid fa-check-double text-[9px] text-[#5288c1]"></i>' : ''}
            </div>
          </div>
        `;
        container.appendChild(msgDiv);
      });

      container.scrollTop = container.scrollHeight;
    }

    function handleSend() {
      const box = document.getElementById('msgBox');
      const text = box.value.trim();
      if (!text) return;

      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      chat.messages.push({ from: 'me', text, time });
      box.value = '';

      saveState();
      renderMessages();
      renderChats();

      // Telegram Echo/Response Simulation
      setTimeout(() => {
        if (chat.type !== 'channel') {
          chat.messages.push({
            from: 'them',
            text: 'Seen and acknowledged.',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          saveState();
          renderMessages();
          renderChats();
        }
      }, 900);
    }

    function sendAttachment(e) {
      const file = e.target.files[0];
      if (!file) return;

      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      chat.messages.push({ from: 'me', text: '', file: file.name, time });

      saveState();
      renderMessages();
      renderChats();
      e.target.value = '';
    }

    function checkEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    }

    function switchFolder(folder) {
      activeFilter = folder;
      document.querySelectorAll('.folder-tab').forEach(b => {
        b.classList.remove('border-[#5288c1]', 'text-[#5288c1]');
        b.classList.add('border-transparent', 'text-[#708499]');
      });
      const activeBtn = document.getElementById(`tab-${folder}`);
      activeBtn.classList.add('border-[#5288c1]', 'text-[#5288c1]');
      activeBtn.classList.remove('border-transparent', 'text-[#708499]');
      renderChats();
    }

    function openModal() {
      document.getElementById('newDialogModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('newDialogModal').classList.add('hidden');
    }

    function confirmCreateConvo() {
      const title = document.getElementById('convoTitle').value.trim();
      const type = document.getElementById('convoType').value;
      if (!title) return;

      const icons = { direct: title.charAt(0).toUpperCase(), group: '👥', channel: '📢' };
      const palette = ['bg-[#3ca568]', 'bg-[#e56555]', 'bg-[#8e85ee]', 'bg-[#e5823b]'];
      const color = palette[Math.floor(Math.random() * palette.length)];

      const newC = {
        id: Date.now(),
        title,
        type,
        avatar: icons[type] || '💬',
        color,
        unread: 0,
        messages: [{ from: 'them', text: `${title} created.`, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]
      };

      chats.unshift(newC);
      saveState();
      closeModal();
      document.getElementById('convoTitle').value = '';
      selectChat(newC.id);
    }

    function saveState() {
      localStorage.setItem('tg_clone_chats', JSON.stringify(chats));
    }

    window.onload = init;
  </script>
</body>
</html>
